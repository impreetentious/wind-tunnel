name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build, and browser audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Scoped to production dependencies: the shipped bundle must stay advisory-free.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:version
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run spec-coverage
      # §7 — lib/engine branch coverage is a gate, not a report. It fails below
      # 90%, and the fix is more tests rather than a lower threshold.
      - run: npm run coverage
      - run: npm run build
      # Static half of `npm run web-vitals`; the Playwright half is one of the
      # specs `npm run e2e` already runs, so running it here would duplicate it.
      - run: node scripts/check-web-vitals.mjs
      - run: npm run e2e
