name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build, and browser audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Scoped to production dependencies: the shipped bundle must stay advisory-free.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:version
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run typecheck
      - run: npm run lint
      # Every § citation in source must resolve in docs/MATH-SPEC.md.
      - run: npm run check:citations
      - run: npm run format:check
      - run: npm run test
      - run: npm run spec-coverage
      # Deliberately ahead of `coverage` and in its own process: this step times
      # the conjoint fit, and v8 coverage instrumentation materially inflates
      # engine timings, so a perf assertion taken under it would be measuring the
      # instrumentation rather than the engine.
      - run: npm run perf:conjoint
      # §7 — lib/engine branch coverage is a gate, not a report. It fails below
      # 90%, and the fix is more tests rather than a lower threshold.
      - run: npm run coverage
      - run: npm run build
      # Static half of `npm run web-vitals`; the Playwright half is one of the
      # specs `npm run e2e` already runs, so running it here would duplicate it.
      - run: node scripts/check-web-vitals.mjs
      - run: npm run e2e
