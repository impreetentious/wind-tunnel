name: Verify

on:
  pull_request:
  push:
    branches:
      - main

# Least privilege: the job only reads the checkout, it never writes back.
permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build, and browser audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The shipped dependency graph must stay free of high-severity advisories.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:version
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run typecheck
      - run: npm run lint
      # Every source citation must resolve in the normative model specification.
      - run: npm run check:citations
      - run: npm run format:check
      - run: npm run test
      - run: npm run spec-coverage
      # Deliberately ahead of `coverage` and in its own process: this step times
      # the conjoint fit, and v8 coverage instrumentation materially inflates
      # engine timings, so a perf assertion taken under it would be measuring the
      # instrumentation rather than the engine.
      - run: npm run perf:conjoint
      # lib/engine branch coverage is a gate, not a report. It fails below
      # 90%, and the fix is more tests rather than a lower threshold.
      - run: npm run coverage
      - run: npm run build
      # Static half of `npm run web-vitals`; the Playwright half is one of the
      # specs `npm run e2e` already runs, so running it here would duplicate it.
      - run: node scripts/check-web-vitals.mjs
      - run: npm run e2e
